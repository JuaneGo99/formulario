<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro de Pacientes Neonatales</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="contenedor">

    <div class="cabecera">
        <h1>REGISTRO DE PACIENTES NEONATALES</h1>
        <p>Control de cultivos y antimicrobianos</p>
    </div>

    <form id="formPaciente">

        <div class="seccion">

            <h2>Datos Generales</h2>

            <div class="grid">

                <div class="campo">
                    <label>No.</label>
                    <input type="number" id="numero">
                </div>

                <div class="campo">
                    <label>Edad Gestacional</label>
                    <input type="number" id="edadGestacional">
                </div>

                <div class="campo">
                    <label>Prematurez</label>
                    <select id="prematurez">
                        <option value="">Seleccione</option>
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Sexo</label>
                    <select id="sexo">
                        <option value="">Seleccione</option>
                        <option>M</option>
                        <option>F</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Tipo de Parto</label>
                    <select id="tipoParto">
                        <option value="">Seleccione</option>
                        <option>PES</option>
                        <option>CSTP</option>
                    </select>
                </div>

                <div class="campo">
                    <label>APGAR</label>
                    <input type="text" id="apgar">
                </div>

                <div class="campo">
                    <label>Talla (cm)</label>
                    <input type="number" id="talla">
                </div>

                <div class="campo">
                    <label>Peso (lb)</label>
                    <input type="number" step="0.01" id="peso">
                </div>

                <div class="campo">
                    <label>Estancia Hospitalaria</label>
                    <input type="number" id="estancia">
                </div>

            </div>

        </div>

        <div class="seccion">

            <h2>Diagnóstico</h2>

            <textarea id="diagnostico"></textarea>

        </div>

        <div class="seccion">

            <h2>Antimicrobianos</h2>

            <div class="grid">

                <div class="campo">
                    <label>Uso de Antimicrobianos</label>
                    <select id="usoAntimicrobiano">
                        <option value="">Seleccione</option>
                        <option>Sí</option>
                        <option>No</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Antimicrobianos Administrados</label>
                    <input type="text" id="antimicrobianos">
                </div>

            </div>

        </div>

        <div class="seccion">

            <h2>Cultivo Positivo</h2>

            <div class="grid">

                <div class="campo">
                    <label>Tipo de Muestra</label>
                    <input type="text" id="tipoMuestra">
                </div>

                <div class="campo">
                    <label>Microorganismo Aislado</label>
                    <input type="text" id="microorganismo">
                </div>

            </div>

            <div class="campo">
                <label>Medicamentos Resistentes (R)</label>
                <textarea id="medR"></textarea>
            </div>

            <div class="campo">
                <label>Medicamentos Intermedios (I)</label>
                <textarea id="medI"></textarea>
            </div>

            <div class="campo">
                <label>Medicamentos Sensibles (S)</label>
                <textarea id="medS"></textarea>
            </div>

        </div>

        <div class="seccion">

            <h2>Antecedentes Maternos</h2>

            <textarea id="antecedentes"></textarea>

        </div>

        <div class="botones">

            <button
                type="button"
                class="btn-guardar"
                onclick="guardarDatos()">
                Guardar Registro
            </button>

            <button
                type="button"
                class="btn-limpiar"
                onclick="limpiarFormulario()">
                Limpiar
            </button>

        </div>

        <div id="mensaje"></div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
